<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClassPulse" />
    <meta name="application-name" content="ClassPulse 2.0" />
    <title>ClassPulse 2.0</title>
    <meta name="description" content="An elegant, responsive Class Schedule and Smart Attendance Tracker featuring student, faculty, and admin dashboards with local-first offline syncing, camera-simulated QR check-ins, and high-performance accessibility presets." />
    <meta property="og:title" content="ClassPulse 2.0" />
    <meta property="og:description" content="An elegant, responsive Class Schedule and Smart Attendance Tracker featuring student, faculty, and admin dashboards with local-first offline syncing, camera-simulated QR check-ins, and high-performance accessibility presets." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Prevent light/dark theme flicker during initial document parse
      (function() {
        try {
          const cached = localStorage.getItem('cp_accessibility');
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed.theme === 'dark') {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
